openapi: 3.0.3
info:
  title: Notification Service
  version: 0.9.0
paths:
  /notifications:
    post:
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message]
              properties:
                email: { type: string, format: email }
                message: { type: string }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
