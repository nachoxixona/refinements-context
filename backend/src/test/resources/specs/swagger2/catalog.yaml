swagger: '2.0'
info:
  title: Catalog Service
  version: 3.1.0
basePath: /
produces: [application/json]
paths:
  /products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: The product
          schema:
            $ref: '#/definitions/Product'
definitions:
  Money:
    type: object
    properties:
      amount: { type: number }
      currency: { type: string }
  Product:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      sku: { type: string }
      price:
        $ref: '#/definitions/Money'
